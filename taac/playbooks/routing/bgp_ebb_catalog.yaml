schema_version: 2

suite:
  id: bgp_ebb
  title: BGP++ EBB CI/CD Catalog
  owner: routing_qual
  summary: >-
    Daily regression catalog for the 20 currently executable BGP++ EBB
    playbooks. Qualification and CI/CD have different purposes: this suite
    continuously detects revision regressions while maintaining representative
    coverage of Gate2 requirements G2-10 through G2-25. The planned 25-case
    target will add five catalog entries only when their executable playbooks
    land.
  playbook_module: neteng.test_infra.dne.taac.playbooks.routing.bgp_ebb_playbooks
  required_requirements:
    - G2-10
    - G2-11
    - G2-12
    - G2-13
    - G2-14
    - G2-15
    - G2-16
    - G2-17
    - G2-18
    - G2-19
    - G2-20
    - G2-21
    - G2-22
    - G2-23
    - G2-24
    - G2-25

sources:
  - id: gate2
    title: Gate2 qualification requirements
    url: https://docs.google.com/document/d/1lQy3aeTXRlXxtjxB1BotD84pqchghrWTb-T4FKRW-j4/edit?tab=t.bz5szmb672zh
  - id: gate1
    title: Gate1 qualification plan
    url: https://docs.google.com/document/d/1vKjERKNSTg_kls1u4JAh84Sk1TJYu5kGX9iaxvpUiiM/edit?tab=t.0#heading=h.p9ark5ckrw4s

coverage_notes:
  - requirement: G2-12
    title: G2-12 daily proxy status
    summary: >-
      CICD-15 is a provisional daily stability proxy, not equivalent to the
      48-hour qualification workload.
    asserted:
      - Four hours of repeated community churn followed by quiesced health checks.
      - Session recovery, crash freedom, snapshots, and CPU and memory trends.
    exercised:
      - Full-scale peer and route state remains active throughout the soak.
    gaps:
      - Qualification-length 48-hour duration.
      - Combined route churn, broader attribute churn, drains, and peer restarts.
      - An approved blocking rule for long-term resource trends.
  - requirement: G2-25
    title: G2-25 current feature coverage
    summary: >-
      The current 20 playbooks provide one explicit runtime-policy assertion
      and several supplemental scaling and implementation-health signals. They
      do not yet establish complete G2-25 feature qualification coverage.
    asserted:
      - CICD-12 validates per-AFI prefix-list updates and route-count transitions without restarting BGP++.
      - CICD-16 monitors queue, process-memory, and liveness behavior under route churn and CPU stress.
      - CICD-17 and CICD-20 bound nexthop-group and ECMP state during route churn.
      - CICD-18 validates IPv6 UPDATE packing with update groups enabled.
      - CICD-19 validates route acceptance and attribute-storage memory growth across unique-combination scale.
    exercised:
      - MED, community, origin, and AS-path mutation during churn and drain workflows.
      - Open/R metric changes, PNH withdrawal and restoration, and multipath recovery.
      - Full-scale MP-BGP, RFC5549-style nexthops, and BGP-MON observation paths.
    gaps:
      - BGP weight support.
      - Complete MED behavior, including missing-AS-worst.
      - Enforce-first-as behavior.
      - Netlink fast-neighbor teardown and latency.
      - Dedicated update-group correctness, backpressure, and edge-case coverage.

categories:
  - id: lifecycle_and_sessions
    title: Lifecycle and Session Stability
  - id: route_and_igp_instability
    title: Route and IGP Instability
  - id: operational_procedures
    title: Operational Procedures
  - id: continuous_operation
    title: Continuous Operation and Resource Regression
  - id: scaling_and_features
    title: Scaling and Feature Regression

topologies:
  - id: ebb_full_scale
    status: modeled
    artifact: neteng.test_infra.dne.taac.abstractions.topologies.ebb_full_scale.ebb_full_scale_topology
    description: >-
      Canonical 1,274-peer EBB topology with eBGP, four iBGP planes, BGP-MON,
      dual-stack parent networks, and optional standalone Open/R.
  - id: ipv6_update_packing
    status: modeled
    artifact: neteng.test_infra.dne.taac.abstractions.topologies.ipv6_update_packing.IPV6_UPDATE_PACKING
    description: >-
      Two-port IPv6 topology with eBGP ingress and iBGP capture egress used by
      the UPDATE-packing workflow.
  - id: bounded_ecmp
    status: modeled
    artifact: neteng.test_infra.dne.taac.abstractions.topologies.bounded_ecmp.BOUNDED_ECMP
    description: >-
      Two-port update-group topology with bounded-ECMP routing groups and
      inspectable IXIA children.
  - id: legacy_two_port_ebb
    status: legacy
    artifact: null
    description: >-
      Current two-port eBGP/iBGP wiring assembled by the BAG012 characteristic
      factories. Constant-attribute storage and queue/memory monitoring must
      migrate to a named topology artifact before this status can be modeled.

validation_phases:
  - id: pre.standard_bgp
    phase: precheck
    implementation: create_standard_prechecks
    healthchecks:
      - startup_bgp_session_verification
      - startup_cpu_load_average_baseline
      - startup_bgp_graceful_restart_disabled_check_v6
      - startup_bgp_graceful_restart_disabled_check_v4
      - startup_hardware_capacity_baseline
      - startup_bgp_convergence
      - startup_ibgp_pnh_verification
      - rib_fib_consistency_precheck
    notes: >-
      The PNH check is present only for Open/R profiles. The remaining checks
      establish the session, resource, convergence, and RIB/FIB baseline.
  - id: pre.runtime_update
    phase: precheck
    implementation: get_profile_checks(CheckProfile.RUNTIME_UPDATE).prechecks
    healthchecks:
      - standard BGP prechecks
      - BGP route-count verification
    notes: Adds an eBGP post-policy route-count baseline to the standard prechecks.
  - id: post.standard_with_convergence
    phase: postcheck
    implementation: create_standard_postchecks(check_bgp_convergence=True)
    healthchecks:
      - postcheck_bgp_convergence_time
      - BGP session establishment
      - BGP stale-route check
      - BGP and system log parsing
      - rib_fib_consistency_postcheck
      - service restart detection
    notes: Enforces final convergence and common BGP control-plane health.
  - id: post.restart_recovery
    phase: postcheck
    implementation: get_profile_checks(CheckProfile.DAEMON_RESTART).postchecks
    healthchecks:
      - postcheck_bgp_convergence_time
      - BGP session establishment
      - BGP stale-route check
      - BGP and system log parsing
      - rib_fib_consistency_postcheck
      - restart-aware BGP service check
    notes: Treats the intentional BGP restart as expected and detects later restarts.
  - id: post.cold_start_recovery
    phase: postcheck
    implementation: get_profile_checks(CheckProfile.COLD_START).postchecks
    healthchecks:
      - postcheck_bgp_convergence_time
      - BGP session establishment
      - BGP stale-route check
      - BGP and system log parsing
      - rib_fib_consistency_postcheck
      - restart-aware BGP service check
    notes: EOR timer expiry is tolerated while final convergence remains enforced.
  - id: post.standard_without_convergence
    phase: postcheck
    implementation: create_standard_postchecks(check_bgp_convergence=False)
    healthchecks:
      - BGP session establishment
      - BGP stale-route check
      - BGP and system log parsing
      - rib_fib_consistency_postcheck
      - service restart detection
    notes: Omits the explicit BGP convergence-time health check.
  - id: post.attribute_churn
    phase: postcheck
    implementation: get_profile_checks(CheckProfile.CHURN_STORM, ProfileContext(full_session_snapshot=True)).postchecks
    healthchecks:
      - expected-count BGP session establishment
      - BGP stale-route check
      - BGP and system log parsing
      - rib_fib_consistency_postcheck
      - service restart detection
    notes: Omits the convergence-time check because the custom step proves every sampled route transition directly.
  - id: post.churn_storm
    phase: postcheck
    implementation: get_profile_checks(CheckProfile.CHURN_STORM).postchecks
    healthchecks:
      - expected-count BGP session establishment
      - BGP stale-route check
      - BGP and system log parsing
      - rib_fib_consistency_postcheck
      - service restart detection
    notes: >-
      Omits the convergence-time check. CICD-11 supplies AS-path length and pool
      size invariants to the RIB/FIB consistency check.
  - id: post.bounded_ecmp
    phase: postcheck
    implementation: get_profile_checks(CheckProfile.PERF_SCALING_BOUNDED_ECMP).postchecks
    healthchecks:
      - BGP session establishment
      - BGP RIB/FIB consistency
      - postcheck_bgp_convergence_time
    notes: Minimal bounded-ECMP recovery chain with standardized retry behavior.
  - id: snapshot.full
    phase: snapshot
    implementation: create_standard_snapshot_checks
    healthchecks:
      - core-dump snapshot check
      - BGP session flap, uptime, and peer-identity snapshot check
    notes: Compares the full session and crash state before and after the workload.
  - id: snapshot.skip_uptime
    phase: snapshot
    implementation: create_standard_snapshot_checks(skip_uptime_check=True)
    healthchecks:
      - core-dump snapshot check
      - BGP session flap and peer-identity snapshot check
    notes: Session uptime is intentionally excluded.
  - id: snapshot.skip_flap
    phase: snapshot
    implementation: create_standard_snapshot_checks(skip_flap_check=True)
    healthchecks:
      - core-dump snapshot check
      - BGP session uptime and peer-identity snapshot check
    notes: Expected session flaps are intentionally excluded.
  - id: snapshot.skip_flap_and_uptime
    phase: snapshot
    implementation: create_standard_snapshot_checks(skip_flap_check=True, skip_uptime_check=True)
    healthchecks:
      - core-dump snapshot check
      - BGP session peer-identity snapshot check
    notes: Expected flap and uptime changes are intentionally excluded.
  - id: snapshot.core_only
    phase: snapshot
    implementation: get_profile_checks(CheckProfile.CHURN_STORM).snapshot_checks
    healthchecks:
      - core-dump snapshot check
    notes: Session snapshots are omitted because sessions may churn throughout the workload.
  - id: snapshot.session_only_skip_flap
    phase: snapshot
    implementation: create_bgp_session_snapshot_check(skip_flap_check=True)
    healthchecks:
      - BGP session uptime snapshot check
    notes: >-
      Used by CICD-16. The general core-dump check is intentionally omitted so
      unrelated process crashes do not fail this BGP++-specific monitor.

validation_chains:
  - id: daemon_restart
    check_profile: DAEMON_RESTART
    implementation: get_profile_checks(CheckProfile.DAEMON_RESTART)
    phases: [pre.standard_bgp, post.restart_recovery, snapshot.skip_uptime]
  - id: cold_start
    check_profile: COLD_START
    implementation: get_profile_checks(CheckProfile.COLD_START)
    phases: [pre.standard_bgp, post.cold_start_recovery, snapshot.full]
  - id: oscillation_skip_flap_and_uptime
    check_profile: OSCILLATION
    implementation: get_profile_checks(CheckProfile.OSCILLATION)
    phases: [pre.standard_bgp, post.standard_without_convergence, snapshot.skip_flap_and_uptime]
  - id: oscillation_skip_uptime
    check_profile: OSCILLATION
    implementation: get_profile_checks(CheckProfile.OSCILLATION)
    phases: [pre.standard_bgp, post.standard_without_convergence, snapshot.skip_uptime]
  - id: oscillation_full_snapshot
    check_profile: OSCILLATION
    implementation: get_profile_checks(CheckProfile.OSCILLATION)
    phases: [pre.standard_bgp, post.standard_without_convergence, snapshot.full]
  - id: igp_instability
    check_profile: IGP_INSTABILITY
    implementation: get_profile_checks(CheckProfile.IGP_INSTABILITY)
    phases: [pre.standard_bgp, post.standard_without_convergence, snapshot.full]
  - id: churn_storm
    check_profile: CHURN_STORM
    implementation: get_profile_checks(CheckProfile.CHURN_STORM)
    phases: [pre.standard_bgp, post.churn_storm, snapshot.core_only]
  - id: attribute_churn
    check_profile: CHURN_STORM
    implementation: get_profile_checks(CheckProfile.CHURN_STORM, ProfileContext(full_session_snapshot=True))
    phases: [pre.standard_bgp, post.attribute_churn, snapshot.full]
  - id: runtime_update
    check_profile: RUNTIME_UPDATE
    implementation: get_profile_checks(CheckProfile.RUNTIME_UPDATE)
    phases: [pre.runtime_update, post.standard_with_convergence, snapshot.full]
  - id: drain_undrain
    check_profile: DRAIN_UNDRAIN
    implementation: get_profile_checks(CheckProfile.DRAIN_UNDRAIN)
    phases: [pre.standard_bgp, post.standard_without_convergence, snapshot.skip_flap]
  - id: soak_without_convergence
    check_profile: SOAK_NO_PRECHECK
    implementation: get_profile_checks(CheckProfile.SOAK_NO_PRECHECK)
    phases: [post.standard_without_convergence, snapshot.skip_flap_and_uptime]
  - id: session_snapshot_only
    check_profile: null
    implementation: create_bgp_session_snapshot_check(skip_flap_check=True)
    phases: [snapshot.session_only_skip_flap]
  - id: soak_with_convergence
    check_profile: SOAK_NO_PRECHECK
    implementation: get_profile_checks(CheckProfile.SOAK_NO_PRECHECK)
    phases: [post.standard_with_convergence, snapshot.skip_flap_and_uptime]
  - id: custom_step_only
    check_profile: null
    implementation: No playbook-level health checks
    phases: []
  - id: bounded_ecmp
    check_profile: PERF_SCALING_BOUNDED_ECMP
    implementation: get_profile_checks(CheckProfile.PERF_SCALING_BOUNDED_ECMP)
    phases: [post.bounded_ecmp, snapshot.skip_flap_and_uptime]

entries:
  - id: CICD-01
    title: BGP daemon restart
    category: lifecycle_and_sessions
    playbook_name: bgp_ebb_daemon_restart_playbook
    requirements:
      - id: G2-11
        role: direct
        coverage: Restart BGP++ and verify full session and control-plane recovery.
    required_topology: ebb_full_scale
    purpose: Detect restart regressions in service recovery, convergence, and resource health.
    stimulus: Restart the BGP++ daemon, restore IXIA peers, and wait 540 seconds for convergence.
    scale: Canonical full-scale EBB peer and route population.
    blocking_signals:
      - Restart profile prechecks and postchecks pass.
      - Expected BGP sessions recover and remain established.
      - Snapshot checks show no unexpected state drift or core dump.
    validation:
      chain: daemon_restart
      spec_vs_implemented:
        - spec: Restart profile prechecks and postchecks pass.
          coverage: implemented
          implemented_by: [pre.standard_bgp, post.restart_recovery]
          gap: null
        - spec: Expected BGP sessions recover and remain established.
          coverage: implemented
          implemented_by: [post.restart_recovery, snapshot.skip_uptime]
          gap: null
        - spec: Snapshot checks show no unexpected state drift or core dump.
          coverage: implemented
          implemented_by: [snapshot.skip_uptime]
          gap: null
      non_chain_validations: []
    expected_runtime: Approximately 34 minutes including shared topology setup.
    cadence: Daily.
    enforcement: blocking
    triage_signals:
      - BGP service lifecycle and peer-state logs.
      - Convergence timeline and failed peer identities.
      - CPU and memory periodic-task samples.
    artifacts:
      - TAAC step and health-check results.
      - BGP service logs and core-dump snapshot.
      - CPU and memory time series.
    qualification_delta: Daily CI performs one representative restart rather than the full qualification campaign.

  - id: CICD-02
    title: BGP cold start
    category: lifecycle_and_sessions
    playbook_name: bgp_ebb_cold_start_playbook
    requirements:
      - id: G2-10
        role: direct
        coverage: Start BGP++ at full scale and verify peer establishment and convergence.
    required_topology: ebb_full_scale
    purpose: Detect cold-start regressions in session fan-in, EOR handling, and convergence.
    stimulus: Start BGP++ without active peers, enable all peer groups together, wait about 500 seconds, and collect thread CPU.
    scale: Canonical full-scale EBB peer and route population.
    blocking_signals:
      - Cold-start profile checks pass.
      - Expected sessions establish and convergence completes.
      - Snapshot, CPU, and memory checks remain healthy.
    validation:
      chain: cold_start
      spec_vs_implemented:
        - spec: Cold-start profile checks pass.
          coverage: implemented
          implemented_by: [pre.standard_bgp, post.cold_start_recovery]
          gap: null
        - spec: Expected sessions establish and convergence completes.
          coverage: implemented
          implemented_by: [post.cold_start_recovery, snapshot.full]
          gap: null
        - spec: Snapshot, CPU, and memory checks remain healthy.
          coverage: partial
          implemented_by: [snapshot.full]
          gap: CPU and memory are periodic tasks, not playbook-level health checks.
      non_chain_validations:
        - Standard CPU and memory periodic tasks run during the workload.
    expected_runtime: About 10 minutes of stimulus plus shared topology setup.
    cadence: Daily.
    enforcement: blocking
    triage_signals:
      - EOR and convergence timeline.
      - Per-thread CPU and peer-establishment failures.
      - BGP startup logs.
    artifacts:
      - TAAC health-check results.
      - BGP startup logs and session snapshots.
      - Thread CPU collection.
    qualification_delta: Daily CI uses the conveyor topology and one synchronized cold-start event.

  - id: CICD-03
    title: eBGP session oscillation
    category: lifecycle_and_sessions
    playbook_name: bgp_ebb_ebgp_session_oscillation_playbook
    requirements:
      - id: G2-18
        role: direct
        coverage: Repeatedly flap eBGP sessions and verify final recovery.
    required_topology: ebb_full_scale
    purpose: Detect session-manager and convergence regressions under sustained eBGP peer churn.
    stimulus: Randomly flap eBGP sessions for 30 minutes using 30-second up and down intervals.
    scale: Seventy eBGP sessions per cycle on the canonical full-scale topology.
    blocking_signals:
      - Oscillation profile prechecks and postchecks pass.
      - All expected sessions recover after churn.
      - No crash, snapshot regression, or resource-limit violation occurs.
    validation:
      chain: oscillation_skip_flap_and_uptime
      spec_vs_implemented:
        - spec: Oscillation profile prechecks and postchecks pass.
          coverage: implemented
          implemented_by: [pre.standard_bgp, post.standard_without_convergence]
          gap: null
        - spec: All expected sessions recover after churn.
          coverage: implemented
          implemented_by: [post.standard_without_convergence, snapshot.skip_flap_and_uptime]
          gap: null
        - spec: No crash, snapshot regression, or resource-limit violation occurs.
          coverage: partial
          implemented_by: [snapshot.skip_flap_and_uptime]
          gap: Flap and uptime comparisons are skipped; resource limits are periodic tasks.
      non_chain_validations:
        - Standard CPU and memory periodic tasks run during the workload.
    expected_runtime: Approximately 1.5 hours including shared topology setup.
    cadence: Daily.
    enforcement: blocking
    triage_signals:
      - Flapped and failed peer sets.
      - Session transition and convergence logs.
      - CPU and memory periodic-task samples.
    artifacts:
      - TAAC stage and health-check results.
      - BGP and IXIA logs.
      - Session and resource snapshots.
    qualification_delta: CI fixes the churn duration and cycle shape for repeatable daily comparison.

  - id: CICD-04
    title: iBGP plane session oscillation
    category: lifecycle_and_sessions
    playbook_name: bgp_ebb_ibgp_plane_session_oscillation_playbook
    requirements:
      - id: G2-19
        role: direct
        coverage: Flap iBGP sessions across all tornado planes and verify recovery.
    required_topology: ebb_full_scale
    purpose: Detect plane-specific session and convergence regressions under sustained iBGP churn.
    stimulus: Flap iBGP sessions across planes 1 through 4 for 30 minutes using 30-second up and down intervals.
    scale: Four dual-stack iBGP planes at canonical full-scale peer counts.
    blocking_signals:
      - Oscillation profile checks pass for every plane.
      - All expected iBGP sessions recover after churn.
      - No crash, snapshot regression, or resource-limit violation occurs.
    validation:
      chain: oscillation_skip_flap_and_uptime
      spec_vs_implemented:
        - spec: Oscillation profile checks pass for every plane.
          coverage: partial
          implemented_by: [pre.standard_bgp, post.standard_without_convergence]
          gap: The shared health-check profile is not evaluated independently per plane.
        - spec: All expected iBGP sessions recover after churn.
          coverage: implemented
          implemented_by: [post.standard_without_convergence, snapshot.skip_flap_and_uptime]
          gap: null
        - spec: No crash, snapshot regression, or resource-limit violation occurs.
          coverage: partial
          implemented_by: [snapshot.skip_flap_and_uptime]
          gap: Flap and uptime comparisons are skipped; resource limits are periodic tasks.
      non_chain_validations:
        - The oscillation stage selects and restores sessions by plane.
        - Standard CPU and memory periodic tasks run during the workload.
    expected_runtime: Approximately 1.6 hours including shared topology setup.
    cadence: Daily.
    enforcement: blocking
    triage_signals:
      - Plane and peer indexes for each failed transition.
      - Session-manager and convergence logs.
      - CPU and memory periodic-task samples.
    artifacts:
      - TAAC stage and health-check results.
      - BGP and IXIA logs.
      - Per-plane session snapshots.
    qualification_delta: CI uses a fixed 30-minute churn window across the representative four-plane topology.

  - id: CICD-05
    title: eBGP route oscillation
    category: route_and_igp_instability
    playbook_name: bgp_ebb_ebgp_route_oscillation_playbook
    requirements:
      - id: G2-20
        role: direct
        coverage: Repeatedly withdraw and readvertise eBGP routes and verify convergence.
    required_topology: ebb_full_scale
    purpose: Detect RIB, FIB, and UPDATE-processing regressions under eBGP route churn.
    stimulus: Repeatedly withdraw and readvertise eBGP prefix indexes 0 through 500.
    scale: Canonical eBGP peer population with 501 selected prefixes per churn operation.
    blocking_signals:
      - Route-oscillation profile checks pass.
      - RIB and FIB converge after the final readvertisement.
      - Sessions, snapshots, and resource checks remain healthy.
    validation:
      chain: oscillation_skip_uptime
      spec_vs_implemented:
        - spec: Route-oscillation profile checks pass.
          coverage: implemented
          implemented_by: [pre.standard_bgp, post.standard_without_convergence]
          gap: null
        - spec: RIB and FIB converge after the final readvertisement.
          coverage: implemented
          implemented_by: [post.standard_without_convergence]
          gap: null
        - spec: Sessions, snapshots, and resource checks remain healthy.
          coverage: partial
          implemented_by: [post.standard_without_convergence, snapshot.skip_uptime]
          gap: Session uptime is skipped; resource checks are periodic tasks.
      non_chain_validations:
        - Standard CPU and memory periodic tasks run during the workload.
    expected_runtime: Approximately 1.9 hours including shared topology setup.
    cadence: Daily.
    enforcement: blocking
    triage_signals:
      - Prefix-pool actions and UPDATE timing.
      - RIB, FIB, and convergence failures.
      - BGP and IXIA logs.
    artifacts:
      - TAAC stage and health-check results.
      - Route-state snapshots.
      - BGP and IXIA logs.
    qualification_delta: CI uses a deterministic prefix slice and conveyor-sized churn window.

  - id: CICD-06
    title: iBGP route oscillation
    category: route_and_igp_instability
    playbook_name: bgp_ebb_ibgp_route_oscillation_playbook
    requirements:
      - id: G2-21
        role: direct
        coverage: Repeatedly withdraw and readvertise iBGP routes and verify convergence.
    required_topology: ebb_full_scale
    purpose: Detect RIB, FIB, and UPDATE-processing regressions under iBGP route churn.
    stimulus: Repeatedly withdraw and readvertise iBGP prefix indexes 0 through 100.
    scale: Canonical iBGP plane population with 101 selected prefixes per churn operation.
    blocking_signals:
      - Route-oscillation profile checks pass.
      - RIB and FIB converge after the final readvertisement.
      - Sessions, snapshots, and resource checks remain healthy.
    validation:
      chain: oscillation_full_snapshot
      spec_vs_implemented:
        - spec: Route-oscillation profile checks pass.
          coverage: implemented
          implemented_by: [pre.standard_bgp, post.standard_without_convergence]
          gap: null
        - spec: RIB and FIB converge after the final readvertisement.
          coverage: implemented
          implemented_by: [post.standard_without_convergence]
          gap: null
        - spec: Sessions, snapshots, and resource checks remain healthy.
          coverage: partial
          implemented_by: [post.standard_without_convergence, snapshot.full]
          gap: Resource checks are periodic tasks, not playbook-level health checks.
      non_chain_validations:
        - Standard CPU and memory periodic tasks run during the workload.
    expected_runtime: Approximately 2 hours including shared topology setup.
    cadence: Daily.
    enforcement: blocking
    triage_signals:
      - Prefix-pool actions and UPDATE timing.
      - RIB, FIB, and convergence failures.
      - BGP and IXIA logs.
    artifacts:
      - TAAC stage and health-check results.
      - Route-state snapshots.
      - BGP and IXIA logs.
    qualification_delta: CI uses a deterministic prefix slice and conveyor-sized churn window.

  - id: CICD-07
    title: IGP PNH metric oscillation
    category: route_and_igp_instability
    playbook_name: bgp_ebb_igp_pnh_metric_oscillation_playbook
    requirements:
      - id: G2-13
        role: direct
        coverage: Oscillate IGP metrics for protocol nexthops without destabilizing BGP sessions.
    required_topology: ebb_full_scale
    purpose: Detect best-path, nexthop tracking, and session regressions caused by repeated Open/R metric changes.
    stimulus: Oscillate metrics for selected IPv4 and IPv6 PNH routes every 30 seconds for 40 minutes while capturing BGP traffic.
    scale: Sixty-three IPv4 and IPv6 PNH routes on standalone Open/R links.
    blocking_signals:
      - IGP-instability profile checks pass.
      - Packet validation sees only expected KEEPALIVE traffic and no OPEN or NOTIFICATION.
      - Cleanup restores original metrics and stable route state.
    validation:
      chain: igp_instability
      spec_vs_implemented:
        - spec: IGP-instability profile checks pass.
          coverage: implemented
