      - RIB, FIB, and session failures.
    artifacts:
      - Nexthop-group measurements.
      - TAAC profile and convergence results.
      - BGP and IXIA logs.
    qualification_delta: Supplemental bounded-state signal; complete G2-25 feature coverage still requires dedicated weight, MED, enforce-first-as, and fast-reset cases.
