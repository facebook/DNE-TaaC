schema_version: 2

suite:
  id: bgp_update_group_qualification
  type: QUAL
  title: BGP++ Update Group Qualification Catalog
  owner: routing_qual
  summary: >-
    Qualification catalog for the 28 active cases in the BGP++ on EOS Update
    Group test plan. It records the source requirement, intended factory and
    playbook, topology, blocking outcomes, and current automation status. The
    repository currently contains 16 implemented factories and 12 skeletons;
    source case 2.9.5 is struck through in the plan and is intentionally absent.
  playbook_module: neteng.test_infra.dne.taac.playbooks.routing.factories.qual_bgp_update_group
  required_requirements:
    - UG-2.1.1
    - UG-2.1.2
    - UG-2.2.1
    - UG-2.2.2
    - UG-2.2.3
    - UG-2.3.1
    - UG-2.3.2
    - UG-2.3.3
    - UG-2.3.4
    - UG-2.4.1
    - UG-2.4.2
    - UG-2.4.3
    - UG-2.5.1
    - UG-2.5.2
    - UG-2.6.1
    - UG-2.7.1
    - UG-2.7.2
    - UG-2.7.3
    - UG-2.7.4
    - UG-2.7.5
    - UG-2.7.6
    - UG-2.9.1
    - UG-2.9.2
    - UG-2.9.3
    - UG-2.9.4
    - UG-2.9.6
    - UG-2.9.7
    - UG-2.9.8

sources:
  - id: update_group_test_plan
    title: Update Group Test Plan — BGP++ on EOS
    url: https://docs.google.com/document/d/1n_Cao8MKBjLUEvZIk58VLMgdWkhWgVcxIaIdOpQipJk/edit?tab=t.0

coverage_notes:
  - requirement: UG-2.9.1
    title: Current automation boundary
    summary: >-
      Sixteen source cases have executable playbooks; twelve retain explicit
      skeleton factories so catalog coverage cannot be mistaken for runnable
      automation.
    asserted:
      - Implemented factories are wired to concrete TestConfig factories and use blocking TAAC assertions where available.
      - Skeleton factories raise NotImplementedError and are not wired into runnable playbook lists.
    exercised:
      - The catalog preserves all 28 active source requirements, including cases that are not automated yet.
    gaps:
      - Implement the twelve skeleton factories and their TestConfig wiring.
      - Reconcile source-plan BGP Monitor expectations with current topologies that deliberately omit BGP Monitor sessions.

categories:
  - id: distribution_correctness
    title: Distribution Correctness
  - id: peer_lifecycle
    title: Peer Lifecycle Within Update Groups
  - id: backpressure
    title: Backpressure and Blocking Behavior
  - id: new_peer_join
    title: New Peer Joining a Busy Group
  - id: multigroup_formation
    title: Multi-Group Formation Correctness
  - id: bit_allocation
    title: Bit Allocation and Group Stability Under Flaps
  - id: disruption_recovery
    title: Disruption and Recovery
  - id: edge_cases
    title: Edge Cases and Adversarial Scenarios

topologies:
  - id: ebb_full_scale_update_group
    status: modeled
    artifact: neteng.test_infra.dne.taac.abstractions.topologies.ebb_full_scale.ebb_full_scale_topology
    description: >-
      Shared EBB-scale topology used by distribution, lifecycle, disruption,
      and edge-case qualification. Current builders generally omit BGP Monitor.
  - id: update_group_backpressure
    status: modeled
    artifact: neteng.test_infra.dne.taac.abstractions.topologies.ug_backpressure.UG_BACKPRESSURE
    description: >-
      Dedicated full-scale route-storm topology with controllable fast and slow
      peers, heavy attributes, and per-peer egress observability.
  - id: update_group_new_peer_join
    status: modeled
    artifact: neteng.test_infra.dne.taac.abstractions.topologies.ug_new_peer_join.UG_NEW_PEER_JOIN
    description: >-
      Dedicated 21-eBGP and 4-iBGP topology with one held-back receiver and
      independent route pools for join, withdrawal, and attribute-change tests.

validation_phases:
  - id: pre.update_group
    phase: precheck
    implementation: Per-factory update-group qualification prechecks
    healthchecks:
      - update group feature enabled or disabled as required by the variant
      - expected BGP sessions established
      - baseline update-group structure and resource health
    notes: Establishes the feature, session, and resource baseline before the workload.
  - id: post.update_group
    phase: postcheck
    implementation: Per-factory update-group qualification postchecks
    healthchecks:
      - expected BGP sessions established
      - update-group structure and membership
      - BGP and system logs
      - CPU, load-average, and VmHWM thresholds
    notes: Enforces final control-plane recovery and resource bounds where the factory supplies them.
  - id: snapshot.standard
    phase: snapshot
    implementation: BGP_STANDARD_SNAPSHOT_CHECKS or equivalent per-factory snapshots
    healthchecks:
      - core-dump snapshot
      - BGP session flap, uptime, and peer-identity snapshot
    notes: Detects crashes and unexpected session drift around the workload.

validation_chains:
  - id: update_group_standard
    check_profile: null
    implementation: Factory-specific prechecks, postchecks, and snapshot checks
    phases: [pre.update_group, post.update_group, snapshot.standard]
  - id: not_implemented
    check_profile: null
    implementation: Skeleton factory raising NotImplementedError
    phases: []

entries:
  - id: QUAL-UG-01
    title: Initial Dump — All Peers in Same Group Receive Identical Routes
    category: distribution_correctness
    playbook_name: bag013_2_1_1_initial_dump_identical_routes
    factory_name: create_bgp_ug_initial_dump_identical_routes_playbook
    implementation_status: implemented
    requirements:
      - id: UG-2.1.1
        role: direct
        coverage: Initial-dump group formation, policy isolation, and identical UPDATE content.
    required_topology: ebb_full_scale_update_group
    purpose: Verify that peers with identical outbound policy share one distribution path and receive equivalent initial UPDATEs.
    stimulus: Bring all IXIA sessions up together, inspect update-group membership, and compare captures from two iBGP peers.
    scale: EBB-scale iBGP and eBGP peer population on bag013.
    blocking_signals:
      - Same-policy peers share an update group and captured initial UPDATE NLRI and attributes match.
      - BGP++ remains crash-free and expected sessions and resource checks pass.
    validation:
      chain: update_group_standard
      spec_vs_implemented:
        - spec: Same-policy peers share an update group and captured initial UPDATE NLRI and attributes match.
          coverage: partial
          implemented_by: [pre.update_group, post.update_group]
          gap: BGP Monitor add-path separation from the source plan is not exercised by the current topology.
        - spec: BGP++ remains crash-free and expected sessions and resource checks pass.
          coverage: implemented
          implemented_by: [post.update_group, snapshot.standard]
          gap: null
      non_chain_validations:
        - Step-local update-group membership and packet-capture comparison assertions enforce the core distribution outcome.
    expected_runtime: Up to 10 minutes for convergence plus packet capture and comparison.
    cadence: Per qualification candidate.
    enforcement: blocking
    triage_signals: [update-group thrift state, IXIA BGP captures and route counts, BGP logs and core dumps]
    artifacts:
      - playbooks/routing/factories/qual_bgp_update_group/tc1_distribution_correctness.py
      - testconfigs/routing/factories/qual_bgp_update_group/tc1_distribution_correctness.py
    qualification_delta: Current automation omits BGP Monitor, so the source plan's add-path group assertion remains a gap.

  - id: QUAL-UG-02
    title: Runtime Route Distribution — Routes Flow to All Group Members
    category: distribution_correctness
    playbook_name: bgp_ug_runtime_route_distribution
    factory_name: create_bgp_ug_runtime_route_distribution_playbook
    implementation_status: skeleton
    requirements:
      - id: UG-2.1.2
        role: direct
        coverage: Runtime add, withdraw, re-add, and community-change distribution to every group member.
    required_topology: ebb_full_scale_update_group
    purpose: Prove that every member receives runtime route operations and converges without stale attributes.
    stimulus: Add 100 routes, withdraw 50, re-add them with a new community, then soak for 10 minutes.
    scale: All iBGP group members plus BGP Monitor in the source plan.
    blocking_signals:
      - Every group member receives the add, withdraw, and re-add with the new community.
      - Sessions remain stable and no stale routes remain after the soak.
    validation:
      chain: not_implemented
      spec_vs_implemented:
        - spec: Every group member receives the add, withdraw, and re-add with the new community.
          coverage: missing
          implemented_by: []
          gap: Factory raises NotImplementedError and no TestConfig wires this case.
        - spec: Sessions remain stable and no stale routes remain after the soak.
          coverage: missing
          implemented_by: []
          gap: No runnable playbook-level validation chain exists.
      non_chain_validations: []
    expected_runtime: Approximately 15 minutes including the 10-minute soak.
    cadence: Not scheduled; skeleton.
    enforcement: informational
    triage_signals: [skeleton factory status, planned IXIA route counts, planned BGP session and stale-route checks]
    artifacts:
      - playbooks/routing/factories/qual_bgp_update_group/tc1_distribution_correctness.py
      - testconfigs/routing/factories/qual_bgp_update_group/tc1_distribution_correctness.py
    qualification_delta: Implement the factory, full-peer route verification, BGP Monitor coverage, and TestConfig wiring.

  - id: QUAL-UG-03
    title: Peer Down — Remaining Group Members Unaffected
    category: peer_lifecycle
    playbook_name: bgp_ug_peer_down_remaining_unaffected
    factory_name: create_bgp_ug_peer_down_remaining_unaffected_playbook
    implementation_status: skeleton
    requirements:
      - id: UG-2.2.1
        role: direct
        coverage: Partial member loss does not interrupt distribution to surviving groups and peers.
    required_topology: ebb_full_scale_update_group
    purpose: Verify that losing 64 eBGP peers does not disrupt iBGP or other update groups.
    stimulus: Stop 64 eBGP sessions, inject 50 routes through survivors, and hold the state for five minutes.
    scale: 64 departing eBGP peers and all iBGP receivers.
    blocking_signals:
      - Surviving groups receive every new route while departed peers are removed cleanly.
      - No iBGP flap, crash, CPU breach, or VmHWM breach occurs.
    validation:
      chain: not_implemented
      spec_vs_implemented:
        - spec: Surviving groups receive every new route while departed peers are removed cleanly.
          coverage: missing
          implemented_by: []
          gap: Factory raises NotImplementedError.
        - spec: No iBGP flap, crash, CPU breach, or VmHWM breach occurs.
          coverage: missing
          implemented_by: []
          gap: No runnable health-check chain exists.
      non_chain_validations: []
    expected_runtime: Approximately 10 minutes.
    cadence: Not scheduled; skeleton.
    enforcement: informational
    triage_signals: [skeleton factory status, planned update-group membership, planned CPU and VmHWM metrics]
    artifacts:
      - playbooks/routing/factories/qual_bgp_update_group/tc2_peer_lifecycle.py
      - testconfigs/routing/factories/qual_bgp_update_group/tc2_peer_lifecycle.py
    qualification_delta: Implement the workload and lifecycle assertions, then wire a runnable TestConfig.

  - id: QUAL-UG-04
    title: Peer Reconnect — Re-Sync from Shadow RIB
    category: peer_lifecycle
    playbook_name: bgp_ug_peer_reconnect_shadow_rib
    factory_name: create_bgp_ug_peer_reconnect_shadow_rib_playbook
    implementation_status: skeleton
    requirements:
      - id: UG-2.2.2
        role: direct
        coverage: Reconnected peers receive routes added during downtime and rejoin the original group.
    required_topology: ebb_full_scale_update_group
    purpose: Prove shadow-RIB resynchronization for peers returning after runtime route additions.
    stimulus: Stop 32 eBGP peers, inject 100 routes, restart the peers, and compare their final route state.
    scale: 32 reconnecting eBGP peers plus all stable receivers.
    blocking_signals:
      - Reconnected peers receive the complete current route set and rejoin their original update group.
      - Route counts match continuously connected peers with no stale state or crash.
    validation:
      chain: not_implemented
      spec_vs_implemented:
        - spec: Reconnected peers receive the complete current route set and rejoin their original update group.
          coverage: missing
          implemented_by: []
          gap: Factory raises NotImplementedError.
        - spec: Route counts match continuously connected peers with no stale state or crash.
          coverage: missing
          implemented_by: []
          gap: No runnable health-check chain exists.
      non_chain_validations: []
    expected_runtime: Approximately 10 minutes.
    cadence: Not scheduled; skeleton.
    enforcement: informational
    triage_signals: [skeleton factory status, planned shadow-RIB route counts, planned update-group membership]
    artifacts:
      - playbooks/routing/factories/qual_bgp_update_group/tc2_peer_lifecycle.py
      - testconfigs/routing/factories/qual_bgp_update_group/tc2_peer_lifecycle.py
    qualification_delta: Implement the reconnect sequence, full-resync assertions, and TestConfig wiring.

  - id: QUAL-UG-05
    title: Sustained Group Membership Churn — No Memory Leak
    category: peer_lifecycle
    playbook_name: bgp_ug_sustained_group_membership_churn
    factory_name: create_bgp_ug_sustained_group_membership_churn_playbook
    implementation_status: skeleton
    requirements:
      - id: UG-2.2.3
        role: direct
        coverage: One hour of peer join and leave cycles without group-state leakage.
    required_topology: ebb_full_scale_update_group
    purpose: Detect memory leaks, orphaned members, and stale group entries during sustained membership churn.
    stimulus: Flap a random set of 32 eBGP peers every minute for one hour with 15-minute checkpoints.
    scale: About 60 churn cycles over 32 eBGP peers.
    blocking_signals:
      - Group membership and route counts remain correct at every checkpoint and after recovery.
      - VmHWM growth stays below 200 MB with no crash, error logs, or load-average breach.
    validation:
      chain: not_implemented
      spec_vs_implemented:
        - spec: Group membership and route counts remain correct at every checkpoint and after recovery.
          coverage: missing
          implemented_by: []
          gap: Factory raises NotImplementedError.
        - spec: VmHWM growth stays below 200 MB with no crash, error logs, or load-average breach.
          coverage: missing
          implemented_by: []
          gap: No runnable resource-monitoring chain exists.
      non_chain_validations: []
    expected_runtime: Slightly over one hour.
    cadence: Not scheduled; skeleton.
    enforcement: informational
    triage_signals: [skeleton factory status, planned VmHWM trend, planned membership checkpoints and EOS logs]
    artifacts:
      - playbooks/routing/factories/qual_bgp_update_group/tc2_peer_lifecycle.py
      - testconfigs/routing/factories/qual_bgp_update_group/tc2_peer_lifecycle.py
    qualification_delta: Implement the one-hour scheduler, memory delta gate, checkpoint assertions, and TestConfig wiring.

  - id: QUAL-UG-06
    title: Fast Peers Not Held Back by Slow Peers
    category: backpressure
    playbook_name: ug_backpressure_fast_peers_not_held_back
    factory_name: create_bgp_ug_backpressure_fast_peers_not_held_back_playbook
    implementation_status: implemented
    requirements:
      - id: UG-2.3.1
        role: direct
        coverage: Per-peer backpressure isolation during a heavy-attribute route storm.
    required_topology: update_group_backpressure
    purpose: Verify that slow peers develop deeper queues without preventing fast peers from making progress.
    stimulus: Inject 10,000 heavy-attribute routes, observe per-peer backpressure, settle, and withdraw the storm.
    scale: EBB-scale sessions with a 10,000-prefix, 32-community, 16-extended-community, 255-ASN workload.
    blocking_signals:
      - Slow peers exhibit backpressure while fast peers continue receiving routes and all queues eventually drain.
      - All peers converge after withdrawal with no stale routes, crash, or resource breach.
    validation:
      chain: update_group_standard
      spec_vs_implemented:
        - spec: Slow peers exhibit backpressure while fast peers continue receiving routes and all queues eventually drain.
          coverage: partial
          implemented_by: [pre.update_group, post.update_group]
          gap: The central queue-asymmetry and progress proofs are step-local rather than playbook health checks.
        - spec: All peers converge after withdrawal with no stale routes, crash, or resource breach.
          coverage: implemented
          implemented_by: [post.update_group, snapshot.standard]
          gap: null
      non_chain_validations:
        - Step-local per-peer queue, blocks, sent-route, and IXIA receive-counter assertions prove fast-peer progress and recovery.
    expected_runtime: Approximately 20 minutes, workload dependent.
    cadence: Per qualification candidate.
    enforcement: blocking
    triage_signals: [per-peer queue and blocks counters, IXIA receive counters, BGP routes and process resources]
    artifacts:
      - playbooks/routing/factories/qual_bgp_update_group/tc3_backpressure.py
      - testconfigs/routing/factories/qual_bgp_update_group/tc3_backpressure.py
    qualification_delta: Uses dedicated fast and TCP-throttled slow peers; current topology omits BGP Monitor.

  - id: QUAL-UG-07
    title: Peer Blocks, Goes Down, Comes Back — Full Recovery
    category: backpressure
    playbook_name: ug_backpressure_peer_blocks_down_recover
    factory_name: create_bgp_ug_backpressure_peer_blocks_down_recover_playbook
    implementation_status: implemented
    requirements:
      - id: UG-2.3.2
        role: direct
        coverage: Blocked-peer teardown and full shadow-RIB recovery after reconnection.
    required_topology: update_group_backpressure
    purpose: Verify that peer removal under backpressure cannot corrupt group state or lose routes learned during downtime.
    stimulus: Inject 5,000 heavy routes, stop selected peers, inject 500 more, then reconnect and verify full recovery.
    scale: 5,500 storm routes with a controlled peer subset transitioning through blocked, down, and recovered states.
    blocking_signals:
      - Remaining peers continue progressing and reconnected peers receive the complete 5,500-route view.
      - No stale routes, crash, core dump, or VmHWM breach remains after recovery.
    validation:
      chain: update_group_standard
      spec_vs_implemented:
        - spec: Remaining peers continue progressing and reconnected peers receive the complete 5,500-route view.
          coverage: partial
          implemented_by: [post.update_group]
          gap: Route-progress and full-resync proofs are enforced by workload steps.
        - spec: No stale routes, crash, core dump, or VmHWM breach remains after recovery.
          coverage: implemented
          implemented_by: [post.update_group, snapshot.standard]
          gap: null
      non_chain_validations:
        - Step-local IXIA toggles, sent-route deltas, and queue-recovery checks enforce the recovery sequence.
    expected_runtime: Approximately 20 minutes, workload dependent.
    cadence: Per qualification candidate.
    enforcement: blocking
    triage_signals: [peer egress queues, shadow-RIB route counts, session transitions and core dumps]
    artifacts:
      - playbooks/routing/factories/qual_bgp_update_group/tc3_backpressure.py
      - testconfigs/routing/factories/qual_bgp_update_group/tc3_backpressure.py
    qualification_delta: The automation provides deterministic slow-peer controls and explicit post-recovery queue gates.

  - id: QUAL-UG-08
    title: Withdraw and Attribute Change Under Backpressure
    category: backpressure
    playbook_name: ug_backpressure_withdraw_attr_change
    factory_name: create_bgp_ug_backpressure_withdraw_attr_change_playbook
    implementation_status: implemented
    requirements:
      - id: UG-2.3.3
        role: direct
        coverage: Withdrawal, re-add, and attribute replacement while egress queues are pressured.
    required_topology: update_group_backpressure
    purpose: Prove ordering and final-state correctness for route operations performed during backpressure.
    stimulus: Build a 5,000-route storm, withdraw and re-add 200 routes with a new community, and modify 100 routes.
    scale: Heavy-attribute storm plus targeted route and community mutations.
    blocking_signals:
      - All receivers converge to the withdrawal, re-add, and new attribute state without stale values.
      - BGP++ remains crash-free and log, session, and snapshot checks pass.
    validation:
      chain: update_group_standard
      spec_vs_implemented:
        - spec: All receivers converge to the withdrawal, re-add, and new attribute state without stale values.
          coverage: partial
          implemented_by: [post.update_group]
          gap: Community replacement and forbidden-old-value assertions are step-local.
        - spec: BGP++ remains crash-free and log, session, and snapshot checks pass.
          coverage: implemented
          implemented_by: [post.update_group, snapshot.standard]
          gap: null
      non_chain_validations:
        - Step-local prefix and community assertions verify the final receiver state before cleanup.
    expected_runtime: Approximately 15 minutes, workload dependent.
    cadence: Per qualification candidate.
    enforcement: blocking
    triage_signals: [route-community state, peer egress counters, BGP and system logs]
    artifacts:
      - playbooks/routing/factories/qual_bgp_update_group/tc3_backpressure.py
      - testconfigs/routing/factories/qual_bgp_update_group/tc3_backpressure.py
    qualification_delta: Automates both the ordered mutation sequence and stale-community rejection.

  - id: QUAL-UG-09
    title: All Peers Block, Then All Go Down, Then All Come Back
    category: backpressure
    playbook_name: ug_backpressure_all_peers_block_down_recover
    factory_name: create_bgp_ug_backpressure_all_peers_block_down_recover_playbook
    implementation_status: implemented
    requirements:
      - id: UG-2.3.4
        role: direct
        coverage: Emptying and rebuilding a fully backpressured eBGP update group.
    required_topology: update_group_backpressure
    purpose: Exercise the worst-case transition from all peers blocked to all peers down and fully resynchronized.
    stimulus: Inject 10,000 heavy routes, stop every eBGP peer, add 500 routes, and restart the full group.
    scale: Full eBGP group with a 10,500-route final shadow-RIB view.
    blocking_signals:
      - The group empties and reforms, and every returning peer receives the full route view.
      - iBGP remains healthy with no crash, core dump, resource breach, or critical log.
    validation:
      chain: update_group_standard
      spec_vs_implemented:
        - spec: The group empties and reforms, and every returning peer receives the full route view.
          coverage: partial
          implemented_by: [post.update_group]
          gap: Group-emptying and full-resync outcomes are asserted by workload steps.
        - spec: iBGP remains healthy with no crash, core dump, resource breach, or critical log.
          coverage: implemented
          implemented_by: [post.update_group, snapshot.standard]
          gap: null
      non_chain_validations:
        - Step-local peer toggles, update-group checks, and route-count deltas enforce empty-group recovery.
    expected_runtime: Approximately 20 minutes, workload dependent.
    cadence: Per qualification candidate.
    enforcement: blocking
    triage_signals: [update-group membership, per-peer route counts and queues, process resources and core dumps]
    artifacts:
      - playbooks/routing/factories/qual_bgp_update_group/tc3_backpressure.py
      - testconfigs/routing/factories/qual_bgp_update_group/tc3_backpressure.py
    qualification_delta: Uses the dedicated backpressure topology and excludes its separate topology-smoke helper from catalog scope.

  - id: QUAL-UG-10
    title: New Peer Joins, Receives Full Sync, Then a Peer Goes Down
    category: new_peer_join
    playbook_name: new_peer_join_full_sync_resilience
    factory_name: create_bgp_ug_new_peer_join_full_sync_resilience_playbook
    implementation_status: implemented
    requirements:
      - id: UG-2.4.1
        role: direct
        coverage: Full initial sync for a joining peer while other members depart.
    required_topology: update_group_new_peer_join
    purpose: Verify that a held-back peer catches up completely and is not disrupted by concurrent peer loss.
    stimulus: Add 200 routes before join, start the held peer, stop 16 distractor peers, then add 50 more routes.
    scale: Dedicated 21-eBGP and 4-iBGP topology with one held receiver and 16 distractors.
    blocking_signals:
      - The new peer receives pre-join routes, completes sync through peer loss, and receives runtime updates.
      - No stale routes, crash, or unexpected session and snapshot failure occurs.
    validation:
      chain: update_group_standard
      spec_vs_implemented:
        - spec: The new peer receives pre-join routes, completes sync through peer loss, and receives runtime updates.
          coverage: partial
          implemented_by: [post.update_group]
          gap: Join-progress and route-delta proofs are step-local.
        - spec: No stale routes, crash, or unexpected session and snapshot failure occurs.
          coverage: implemented
          implemented_by: [post.update_group, snapshot.standard]
          gap: null
      non_chain_validations:
        - Step-local held-peer, distractor-peer, and route-count assertions enforce the source sequence.
    expected_runtime: Approximately 15 minutes.
    cadence: Per qualification candidate.
    enforcement: blocking
    triage_signals: [held-peer IXIA state, per-peer sent-route counts, update-group membership and logs]
    artifacts:
      - playbooks/routing/factories/qual_bgp_update_group/tc4_new_peer_join.py
      - testconfigs/routing/factories/qual_bgp_update_group/tc4_new_peer_join.py
    qualification_delta: Uses a smaller deterministic topology rather than every EBB peer in the source-plan narrative.

  - id: QUAL-UG-11
    title: New Peer Joins, Then Routes Are Withdrawn
    category: new_peer_join
    playbook_name: new_peer_join_routes_withdrawn
    factory_name: create_bgp_ug_new_peer_join_routes_withdrawn_playbook
    implementation_status: implemented
    requirements:
      - id: UG-2.4.2
        role: direct
        coverage: A joining peer processes withdrawals issued while its initial sync is in progress.
    required_topology: update_group_new_peer_join
    purpose: Ensure a late peer ends with the current RIB rather than a stale pre-withdrawal snapshot.
    stimulus: Inject 500 routes, start the held peer, immediately withdraw 200 routes, and compare final counts.
    scale: One held receiver and a 500-to-300 route transition.
    blocking_signals:
      - The joining peer and stable peers finish with exactly the same 300-route view.
      - No stale routes, crash, or unexpected session and snapshot failure occurs.
    validation:
      chain: update_group_standard
      spec_vs_implemented:
        - spec: The joining peer and stable peers finish with exactly the same 300-route view.
          coverage: partial
          implemented_by: [post.update_group]
          gap: Exact held-peer route-count comparison is step-local.
